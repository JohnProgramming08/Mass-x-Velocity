{% extends "joined.html" %} {% block style2 %}
<link
	rel="stylesheet"
	href="{{ url_for('static', filename='css/finish.css') }}"
/>
{% endblock %} {% block main %}
<main>
	<div id="summary-div" class="card">
		<h3>Well Done!</h3>
		<div class="data-div">
			<p>Gained Momentum:</p>
			<h4>{{ gained_momentum }}</h4>
		</div>

		<div class="data-div">
			<p>Total Questions:</p>
			<h4>{{ total }}</h4>
		</div>

		<div class="data-div">
			<p>Accuracy:</p>
			<h4>{{ accuracy }}%</h4>
		</div>
	</div>
</main>
{% endblock %}
